<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Voluntário - Salvando a Mata</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<header>

    <a href="../index.html">

        <img
            src="../imagens/logo.png"
            alt="Logo da ONG Salvando a Mata">

    </a>

    <nav aria-label="Navegação principal">

        <ul class="menu">

            <li>
                <a href="../index.html">
                    Início
                </a>
            </li>

            <li>
                <a href="../index.html#sobre">
                    Sobre
                </a>
            </li>

            <li>
                <a href="../index.html#projetos">
                    Projetos
                </a>
            </li>

            <li>
                <a href="../index.html#voluntario">
                    Seja voluntário
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <section class="cadastro">

        <h1>Cadastro de Voluntário</h1>

        <p>
            Preencha o formulário abaixo para fazer parte
            das ações da ONG Salvando a Mata.
        </p>


        <form id="formCadastro">


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required>

            </div>


            <!-- E-MAIL -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required>

            </div>


            <!-- DATA DE NASCIMENTO -->

            <div class="campo">

                <label for="nascimento">
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required>

            </div>


            <!-- CPF -->

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required>

            </div>


            <!-- TELEFONE -->

            <div class="campo">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                    required>

            </div>


            <!-- CEP -->

            <div class="campo">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    maxlength="9"
                    required>

            </div>


            <!-- ESTADO -->

            <div class="campo">

                <label for="estado">
                    Estado
                </label>

                <select
                    id="estado"
                    name="estado"
                    required>

                    <option value="">
                        Carregando estados...
                    </option>

                </select>

            </div>


            <!-- CIDADE -->

            <div class="campo">

                <label for="cidade">
                    Cidade
                </label>

                <select
                    id="cidade"
                    name="cidade"
                    required
                    disabled>

                    <option value="">
                        Selecione primeiro o estado
                    </option>

                </select>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn">

                Cadastrar como voluntário

            </button>


            <!-- MENSAGEM -->

            <div
                id="mensagem"
                role="alert"
                aria-live="polite">
            </div>

        </form>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Salvando a Mata - Projeto acadêmico.
    </p>

</footer>


<script src="../js/cadastro.js"></script>

</body>

</html>
