```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - Salvando a Mata</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <a href="index.html">
        <img src="img/logo.svg" alt="Logo da ONG Salvando a Mata">
    </a>

    <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="index.html#sobre">Sobre</a>
        <a href="index.html#projetos">Projetos</a>
    </nav>
</header>

<main>

    <section>

        <h1>Cadastro de voluntário</h1>

        <p>
            Preencha seus dados para participar das ações
            da ONG Salvando a Mata.
        </p>

        <form action="#" method="post">

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="nascimento">Data de nascimento</label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >

                <label for="cpf">CPF</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    maxlength="14"
                    required
                >

            </fieldset>

            <fieldset>

                <legend>Contato e endereço</legend>

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    maxlength="15"
                    required
                >

                <label for="cep">CEP</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    pattern="[0-9]{5}-[0-9]{3}"
                    maxlength="9"
                    required
                >

                <label for="cidade">Cidade</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <label for="estado">Estado</label>

                <select
                    id="estado"
                    name="estado"
                    required
                >
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PR">Paraná</option>
                    <option value="outro">Outro</option>
                </select>

            </fieldset>

            <button type="submit">
                Enviar cadastro
            </button>

        </form>

    </section>

</main>

<footer>
    <p>
        &copy; 2026 Salvando a Mata - Projeto acadêmico.
    </p>
</footer>

</body>
</html>
```
